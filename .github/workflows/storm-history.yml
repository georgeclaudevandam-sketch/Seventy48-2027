name: Storm history (late May to June wind along the course)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/storm_history.py"
      - ".github/workflows/storm-history.yml"

permissions:
  contents: write

concurrency:
  group: storm-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/storm_history.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A data/storm_history
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update storm history"
          git pull --rebase
          git push

name: Fetch the vessel traffic lanes (OpenStreetMap seamarks)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_lanes.py"
      - ".github/workflows/lanes.yml"
      - "data/route.json"

permissions:
  contents: write

concurrency:
  group: lanes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/fetch_lanes.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A data/lanes.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update traffic lanes"
          git pull --rebase
          git push
